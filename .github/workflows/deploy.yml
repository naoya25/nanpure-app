name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 実行中のデプロイは止めない（途中で切ると公開物が壊れうる）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # ローカルの検証環境が v22.23.2。test.yml は 20 のままで揃えていない
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # next.config.ts の output: "export" により out/ が生成される
      - name: Build static export
        run: npm run build

      # 公式 Pages Actions は Jekyll を通さないため本来不要だが、
      # _next/ がアンダースコア始まりのため保険として置く
      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
